version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DATABASE_PATH=/data/gptimg.db
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-random-32-char-string}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-your-32-byte-encryption-key-here}
      - STORAGE_PATH=/storage/images
      - ALLOWED_ORIGIN=http://localhost:3000
    volumes:
      - backend-data:/data
      - backend-storage:/storage/images
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3010:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  backend-storage:
