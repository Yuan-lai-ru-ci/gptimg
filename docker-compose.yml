version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_PORT=8080
      - DATABASE_PATH=/data/gptimg.db
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-random-32-char-string}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-your-32-byte-encryption-key-here}
      - STORAGE_PATH=/storage/images
      - FRONTEND_PATH=/app/frontend
      - ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://47.109.108.57:18080,http://lqbz.sheyice.com,https://lqbz.sheyice.com
    volumes:
      - backend-data:/data
      - backend-storage:/storage/images
    restart: unless-stopped

volumes:
  backend-data:
  backend-storage:
